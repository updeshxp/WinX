name: Android CI Bionic

on:
  push:
    branches: [ "winlator_bionic" ]
  pull_request:
    branches: [ "winlator_bionic" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Get build information
      id: build_info
      shell: bash
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        FULL_SHA=$(git rev-parse HEAD)
        BRANCH="${GITHUB_REF_NAME}"

        echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
        echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

        echo "Short SHA: $SHORT_SHA"
        echo "Full SHA: $FULL_SHA"
        echo "Branch: $BRANCH"

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Decode signing keystore
      if: github.event_name == 'push'
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/winlator-release.jks"

    - name: Sign Release APK
      if: github.event_name == 'push'
      env:
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        UNSIGNED_APK=$(find app/build/outputs -type f -name "*unsigned.apk" | head -n 1)

        if [ -z "$UNSIGNED_APK" ]; then
          echo "::error::Unsigned APK not found"
          exit 1
        fi

        echo "Signing: $UNSIGNED_APK"

        "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
          --ks "$RUNNER_TEMP/winlator-release.jks" \
          --ks-key-alias "$KEY_ALIAS" \
          --ks-pass "pass:$KEYSTORE_PASSWORD" \
          --key-pass "pass:$KEY_PASSWORD" \
          --out "$RUNNER_TEMP/winlator-bionic.apk" \
          "$UNSIGNED_APK"

    - name: Verify APK signature
      if: github.event_name == 'push'
      run: |
        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
          --verbose \
          "$RUNNER_TEMP/winlator-bionic.apk"

    - name: Prepare APK
      if: github.event_name == 'push'
      run: |
        cp "$RUNNER_TEMP/winlator-bionic.apk" \
          "Winlator-Bionic-${{ steps.build_info.outputs.short_sha }}.apk"

    - name: Create GitHub Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: winlator-bionic-${{ steps.build_info.outputs.short_sha }}
        name: Winlator Bionic - ${{ steps.build_info.outputs.short_sha }}
        body: |
          ## Winlator Bionic Custom Release

          **Branch:** `${{ steps.build_info.outputs.branch }}`
          **Commit:** `${{ steps.build_info.outputs.full_sha }}`
          **Short Commit:** `${{ steps.build_info.outputs.short_sha }}`
          **Build:** `Release`
          **Signed:** `Yes`
          **Workflow Run:** `${{ github.run_id }}`

        files: Winlator-Bionic-${{ steps.build_info.outputs.short_sha }}.apk
        draft: false
        prerelease: false